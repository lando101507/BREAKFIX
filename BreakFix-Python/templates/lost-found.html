<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost & Found - BreakFix</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        .form-card {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, .06);
        }

        .form-header {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-header-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #fff7ed;
            color: #f97316;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .form-header h1 {
            margin: 0 0 5px;
            color: #0f172a;
            font-size: 24px;
        }

        .form-header p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 24px;
        }

        .type-option input {
            display: none;
        }

        .type-option label {
            display: block;
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 13px;
            cursor: pointer;
            text-align: center;
        }

        .type-option label i {
            display: block;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .type-option label strong {
            display: block;
            color: #1e293b;
        }

        .type-option label small {
            color: #64748b;
        }

        .type-option input:checked + label {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }

        .form-group label span {
            color: #ef4444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .cancel-btn,
        .submit-btn {
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .cancel-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
        }

        @media (max-width: 600px) {

            .type-grid {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 20px;
            }

            .form-buttons {
                flex-direction: column;
            }

            .cancel-btn,
            .submit-btn {
                text-align: center;
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="dashboard-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-tools"></i>
            <span>BreakFix</span>
        </div>

        <div class="user-card">

            <div class="user-icon">
                <i class="bi bi-person-fill"></i>
            </div>

            <div>
                <strong>{{ fullname }}</strong>
                <small>{{ role|capitalize }}</small>
            </div>

        </div>

        <nav class="sidebar-nav">

            <a href="/dashboard">
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>

            <a href="/report-problem">
                <i class="bi bi-exclamation-circle-fill"></i>
                Report Problem
            </a>

            <a href="/my-reports">
                <i class="bi bi-file-earmark-text-fill"></i>
                My Reports
            </a>

            <a href="/lost-found" class="active">
                <i class="bi bi-search"></i>
                Lost & Found
            </a>

            <a href="/my-items">
                <i class="bi bi-box-seam-fill"></i>
                My Items
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="/logout" class="logout">
                <i class="bi bi-box-arrow-left"></i>
                Logout
            </a>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h2>Lost & Found</h2>

                <p>
                    Report lost or found workplace items
                </p>

            </div>

            <div class="system-status">

                <span></span>

                System Online

            </div>

        </header>


        <section class="content">

            <div class="form-card">

                <div class="form-header">

                    <div class="form-header-icon">
                        <i class="bi bi-search"></i>
                    </div>

                    <div>

                        <h1>
                            Lost & Found Report
                        </h1>

                        <p>
                            Help your coworkers find lost belongings.
                        </p>

                    </div>

                </div>


                <form method="POST">


                    <!-- TYPE -->

                    <div class="form-group">

                        <label>
                            What are you reporting? <span>*</span>
                        </label>

                        <div class="type-grid">

                            <div class="type-option">

                                <input
                                    type="radio"
                                    name="item_type"
                                    value="LOST"
                                    id="lost"
                                    required
                                >

                                <label for="lost">

                                    <i class="bi bi-question-circle"></i>

                                    <strong>Lost Item</strong>

                                    <small>
                                        I lost something.
                                    </small>

                                </label>

                            </div>


                            <div class="type-option">

                                <input
                                    type="radio"
                                    name="item_type"
                                    value="FOUND"
                                    id="found"
                                >

                                <label for="found">

                                    <i class="bi bi-check-circle"></i>

                                    <strong>Found Item</strong>

                                    <small>
                                        I found something.
                                    </small>

                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- ITEM NAME -->

                    <div class="form-group">

                        <label>
                            Item Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="item_name"
                            placeholder="Example: Black Wallet"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label>
                            Category <span>*</span>
                        </label>

                        <select name="category" required>

                            <option value="">
                                Select a category
                            </option>

                            <option value="Wallet">
                                Wallet
                            </option>

                            <option value="Mobile Phone">
                                Mobile Phone
                            </option>

                            <option value="ID / Card">
                                ID / Card
                            </option>

                            <option value="Keys">
                                Keys
                            </option>

                            <option value="Bag">
                                Bag
                            </option>

                            <option value="Clothing">
                                Clothing
                            </option>

                            <option value="Electronic">
                                Electronic
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- LOCATION -->

                    <div class="form-group">

                        <label>
                            Location <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="location"
                            placeholder="Example: 2nd Floor, Room 204"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label>
                            Description <span>*</span>
                        </label>

                        <textarea
                            name="description"
                            placeholder="Describe the item and other useful details..."
                            required
                        ></textarea>

                    </div>


                    <!-- BUTTONS -->

                    <div class="form-buttons">

                        <a
                            href="/dashboard"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            <i class="bi bi-send-fill"></i>
                            Submit Report
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>

</body>

</html>
